<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1c38" />
      <stop offset="70%" stop-color="#101226" />
      <stop offset="100%" stop-color="#0a0b14" />
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#7c5cff" />
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c5cff" />
      <stop offset="100%" stop-color="#ff3399" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="400" height="400" rx="36" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="388" height="388" rx="30" fill="none" stroke="url(#neonCyan)" stroke-width="2" stroke-dasharray="12 8" opacity="0.6"/>

  <!-- Cyber Grid Accents -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#7c5cff" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 6"/>
  <circle cx="200" cy="200" r="130" fill="none" stroke="#00e5ff" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Abstract Tech Avatar Silhouette -->
  <!-- Shoulders -->
  <path d="M 100 340 C 100 280, 150 250, 200 250 C 250 250, 300 280, 300 340 Z" fill="#181a33" stroke="url(#neonCyan)" stroke-width="2.5" filter="url(#neonGlow)"/>

  <!-- Head / Face Shield -->
  <path d="M 145 170 C 145 100, 255 100, 255 170 C 255 220, 200 238, 200 238 C 200 238, 145 220, 145 170 Z" fill="#13152c" stroke="url(#neonPurple)" stroke-width="3" filter="url(#neonGlow)"/>

  <!-- Futuristic Visor Line -->
  <path d="M 160 162 Q 200 178 240 162" fill="none" stroke="#00e5ff" stroke-width="5" stroke-linecap="round" filter="url(#neonGlow)"/>

  <!-- Monogram Initials Badge -->
  <circle cx="200" cy="90" r="28" fill="#0d0e1c" stroke="url(#neonCyan)" stroke-width="2"/>
  <text x="200" y="97" font-family="'Poppins', sans-serif" font-weight="700" font-size="20" fill="#00e5ff" text-anchor="middle" letter-spacing="1">KR</text>

  <!-- Status / Role Badge -->
  <rect x="120" y="325" width="160" height="32" rx="16" fill="#0c0e1e" stroke="#7c5cff" stroke-width="1.5"/>
  <circle cx="138" cy="341" r="5" fill="#00e5ff" filter="url(#neonGlow)"/>
  <text x="204" y="346" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#e8eaf6" text-anchor="middle">KAPISH RAWAT</text>

  <!-- Floating Tech Corner Accents -->
  <path d="M 30 50 L 50 30 L 75 30" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.8"/>
  <path d="M 370 50 L 350 30 L 325 30" fill="none" stroke="#7c5cff" stroke-width="2" opacity="0.8"/>
  <path d="M 30 350 L 50 370 L 75 370" fill="none" stroke="#7c5cff" stroke-width="2" opacity="0.8"/>
  <path d="M 370 350 L 350 370 L 325 370" fill="none" stroke="#00e5ff" stroke-width="2" opacity="0.8"/>
</svg>

